name: Build release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the plugin version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' simple-youtube-embedding.php)
          CONSTANT=$(grep -oP "SYE_VERSION\s*=\s*'\K[0-9.]+" simple-youtube-embedding.php)
          STABLE=$(grep -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)
          echo "Tag: $TAG, header: $HEADER, constant: $CONSTANT, readme: $STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONSTANT" && test "$TAG" = "$STABLE"

      - name: Build ZIP (folder simple-youtube-embedding/)
        run: |
          mkdir -p build/simple-youtube-embedding
          git archive HEAD | tar -x -C build/simple-youtube-embedding
          cd build && zip -r ../simple-youtube-embedding.zip simple-youtube-embedding

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" simple-youtube-embedding.zip --clobber
